<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEED - 魚三楼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ink: #1a1612;
      --paper: #f5f0e8;
      --gold: #b8965a;
      --fade: #8a7d6e;
      --line: #d4c9b0;
      --error: #c0392b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 80px;
    }

    .seed-mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--fade);
      text-transform: uppercase;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeIn 1s ease 0.2s forwards;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: white;
      border: 1px solid var(--line);
      padding: 40px 32px;
      opacity: 0;
      animation: fadeIn 1s ease 0.5s forwards;
    }

    .place-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      color: var(--ink);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .place-name-ja {
      font-size: 14px;
      font-weight: 300;
      color: var(--fade);
      letter-spacing: 0.1em;
      margin-bottom: 24px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin-bottom: 24px;
    }

    .timestamp {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      color: var(--fade);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .weather-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .temp {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 300;
      color: var(--ink);
      line-height: 1;
    }

    .weather-desc {
      font-size: 12px;
      color: var(--fade);
      letter-spacing: 0.05em;
    }

    .description {
      font-size: 13px;
      line-height: 2;
      color: var(--ink);
      font-weight: 300;
      margin-bottom: 32px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 20px 0;
    }

    .message {
      font-size: 12px;
      color: var(--fade);
      line-height: 1.8;
      letter-spacing: 0.03em;
      margin-bottom: 32px;
    }

    .badge-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
    }

    .badge-id {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: var(--line);
      letter-spacing: 0.1em;
    }

    .seed-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-style: italic;
      color: var(--gold);
      letter-spacing: 0.1em;
    }

    .auth-section {
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .auth-title {
      font-size: 12px;
      color: var(--fade);
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      background: white;
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.05em;
    }

    .btn:hover {
      background: var(--paper);
    }

    .btn-primary {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .btn-primary:hover {
      background: #2d2620;
    }

    .divider-text {
      text-align: center;
      font-size: 11px;
      color: var(--line);
      margin: 12px 0;
      letter-spacing: 0.1em;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: white;
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      color: var(--ink);
      outline: none;
    }

    .input:focus {
      border-color: var(--gold);
    }

    .error-msg {
      font-size: 11px;
      color: var(--error);
      margin-top: 8px;
      line-height: 1.6;
    }

    .record-section {
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .record-title {
      font-size: 12px;
      color: var(--fade);
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    .record-item {
      font-size: 12px;
      color: var(--ink);
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      letter-spacing: 0.05em;
    }

    .visit-count {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .visit-label {
      font-size: 11px;
      color: var(--fade);
      letter-spacing: 0.1em;
    }

    .logout-btn {
      margin-top: 16px;
      font-size: 11px;
      color: var(--fade);
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: underline;
      font-family: 'Noto Serif JP', serif;
    }

    .first-visitor-badge {
      background: var(--ink);
      color: white;
      padding: 4px 10px;
      font-size: 11px;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      display: inline-block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="seed-mark">Reality Protocol · SEED</div>

  <div class="card">
    <div class="place-name">Uosanrou</div>
    <div class="place-name-ja">魚三楼</div>
    <div class="divider"></div>

    <div class="timestamp" id="timestamp">読み込み中...</div>

    <div class="weather-row">
      <div class="temp" id="temp">--</div>
      <div class="weather-desc" id="weather-desc">--</div>
    </div>

    <div class="description">
      1868年、鳥羽伏見の戦い。<br>
      この建物の壁には今もその弾痕が残る。<br>
      あなたは今日、その場所に立った。
    </div>

    <div class="message" id="fixed-message">
      この記録は変更されない。<br>
      あなたがここにいた事実は、消えない。
    </div>

    <div class="badge-footer">
      <div class="badge-id" id="badge-id">SEED-USR-001</div>
      <div class="seed-logo">SEED</div>
    </div>

    <div class="auth-section" id="auth-section">
      <div class="auth-title">記録を残すにはサインインしてください</div>

      <div class="auth-buttons">
        <button class="btn" type="button" onclick="signInWithGoogle()">Googleでサインイン</button>
        <button class="btn" type="button" onclick="signInWithApple()">Appleでサインイン</button>
      </div>

      <div class="divider-text">または</div>

      <div class="input-group">
        <input class="input" type="email" id="email-input" placeholder="メールアドレス" autocomplete="email">
        <input class="input" type="password" id="password-input" placeholder="パスワード（6文字以上）" autocomplete="current-password">
      </div>

      <div class="auth-buttons">
        <button class="btn btn-primary" type="button" onclick="signInWithEmail()">サインイン</button>
        <button class="btn" type="button" onclick="signUpWithEmail()">新規登録</button>
      </div>

      <div class="error-msg" id="auth-error"></div>
    </div>

    <div class="record-section" id="record-section" style="display:none;">
      <div id="first-visitor-display"></div>
      <div class="visit-count" id="visit-count">--</div>
      <div class="visit-label">VISITS TO THIS PLACE</div>

      <div class="record-title" style="margin-top:20px;">来訪記録</div>
      <div id="visit-history"></div>

      <button class="logout-btn" type="button" onclick="signOut()">サインアウト</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jlwmkrjmhbvuazcvcaxn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsd21rcmptaGJ2dWF6Y3ZjYXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDM3MjMsImV4cCI6MjA5NTcxOTcyM30.KBSoZqxpwpjWPqTxHsdBuVqPWfZ56LQwdD74wQT7mMM';
    const WEATHER_API_KEY = 'df37717c9cd19e230fa44ec083db7edf';
    const PLACE_ID = 'uosanrou-fushimi';
    const LAT = 34.9333;
    const LON = 135.7667;

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentWeather = '--';
    let currentTemp = null;
    let visitAlreadySaved = false;

    const now = new Date();
    const dateStr = now.toLocaleDateString('ja-JP', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    });
    const timeStr = now.toLocaleTimeString('ja-JP', {
      hour: '2-digit',
      minute: '2-digit'
    });
    document.getElementById('timestamp').textContent = `${dateStr} ${timeStr}`;

    const id = 'SEED-USR-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    document.getElementById('badge-id').textContent = id;

    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${WEATHER_API_KEY}&units=metric&lang=ja`)
      .then(res => res.json())
      .then(data => {
        if (!data.main || !data.weather || !data.weather[0]) {
          throw new Error('Invalid weather response');
        }

        currentTemp = Math.round(data.main.temp);
        currentWeather = data.weather[0].description;
        document.getElementById('temp').textContent = currentTemp + '°';
        document.getElementById('weather-desc').textContent = currentWeather;
      })
      .catch(() => {
        document.getElementById('temp').textContent = '--°';
        document.getElementById('weather-desc').textContent = '取得できませんでした';
      });

    sb.auth.onAuthStateChange(async (_event, session) => {
      if (session) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('record-section').style.display = 'block';
        await saveVisitAndShowHistory(session.user.id);
      } else {
        visitAlreadySaved = false;
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('record-section').style.display = 'none';
        document.getElementById('first-visitor-display').innerHTML = '';
        document.getElementById('visit-count').textContent = '--';
        document.getElementById('visit-history').innerHTML = '';
      }
    });

    async function saveVisitAndShowHistory(userId) {
      showError('');
      document.getElementById('first-visitor-display').innerHTML = '';

      if (!visitAlreadySaved) {
        const { error: insertError } = await sb.from('visits').insert({
          user_id: userId,
          place_id: PLACE_ID,
          visited_at: new Date().toISOString(),
          weather: currentWeather,
          temperature: currentTemp
        });

        if (insertError) {
          showError('来訪記録を保存できませんでした。');
          console.error(insertError);
          return;
        }

        visitAlreadySaved = true;
      }

      const { data: allVisits, error: allVisitsError } = await sb
        .from('visits')
        .select('*')
        .eq('place_id', PLACE_ID)
        .order('visited_at', { ascending: true });

      if (allVisitsError) {
        showError('来訪記録を読み込めませんでした。');
        console.error(allVisitsError);
        return;
      }

      if (allVisits && allVisits.length > 0) {
        const firstVisitorId = allVisits[0].user_id;
        if (firstVisitorId === userId) {
          document.getElementById('first-visitor-display').innerHTML =
            '<div class="first-visitor-badge">FIRST VISITOR</div>';
        }
      }

      const { data: myVisits, error: myVisitsError } = await sb
        .from('visits')
        .select('*')
        .eq('place_id', PLACE_ID)
        .eq('user_id', userId)
        .order('visited_at', { ascending: false });

      if (myVisitsError) {
        showError('あなたの来訪履歴を読み込めませんでした。');
        console.error(myVisitsError);
        return;
      }

      document.getElementById('visit-count').textContent = myVisits ? myVisits.length : 0;

      const historyHtml = (myVisits || []).map(v => {
        const visitedAt = v.visited_at || v.created_at;
        const d = new Date(visitedAt);
        const formattedDate = d.toLocaleDateString('ja-JP', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
        const temp = v.temperature !== null && v.temperature !== undefined ? `${v.temperature}°` : '--°';
        const weather = v.weather || '--';
        return `<div class="record-item">${formattedDate} ${temp} ${weather}</div>`;
      }).join('');

      document.getElementById('visit-history').innerHTML = historyHtml;
    }

    async function signInWithGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });

      if (error) showError(error.message);
    }

    async function signInWithApple() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'apple',
        options: { redirectTo: window.location.href }
      });

      if (error) showError(error.message);
    }

    async function signInWithEmail() {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showError('メールアドレスとパスワードを入力してください。');
        return;
      }

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showError('メールアドレスまたはパスワードが違います。');
      }
    }

    async function signUpWithEmail() {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email) {
        showError('メールアドレスを入力してください。');
        return;
      }

      if (password.length < 6) {
        showError('パスワードは6文字以上にしてください。');
        return;
      }

      const { error } = await sb.auth.signUp({ email, password });

      if (error) {
        showError(error.message);
      } else {
        showError('確認メールを送信しました。メールを確認してください。');
      }
    }

    async function signOut() {
      await sb.auth.signOut();
      window.location.reload();
    }

    function showError(msg) {
      document.getElementById('auth-error').textContent = msg;
    }
  </script>
</body>
</html>
